name: Setup third-party
description: >
  Restore the Eloq third-party workspace from cache, or build it from source and
  cache it. The cache key covers the Data Substrate third-party manifest, build
  scripts, and pinned source submodule commits.

inputs:
  source-dir:
    description: Path to the checked-out eloqdoc repo.
    required: true
  arch:
    description: amd64 or arm64.
    required: true
  cache-scope:
    description: Build-environment id folded into the cache key.
    required: true
  prefix:
    description: Install prefix to cache.
    default: /opt/eloq/third_party

outputs:
  cache-hit:
    description: 'true if the prefix was restored from cache.'
    value: ${{ steps.tp-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Compute third-party cache key
      id: tp-key
      shell: bash
      working-directory: ${{ inputs.source-dir }}
      run: |
        set -euo pipefail
        git config --global --add safe.directory '*'
        ds=src/mongo/db/modules/eloq/data_substrate
        h=$(git -C "${ds}" ls-files -s -- \
              third_party/manifest.yml \
              scripts/third_party \
              third_party/src/brpc third_party/src/braft \
              third_party/src/mimalloc third_party/src/rocksdb-cloud \
            | sha256sum | cut -c1-16)
        echo "key=tp-${{ inputs.arch }}-${{ inputs.cache-scope }}-${h}" >> "$GITHUB_OUTPUT"

    - name: Restore third-party cache
      id: tp-cache
      uses: actions/cache@v4
      with:
        path: ${{ inputs.prefix }}
        key: ${{ steps.tp-key.outputs.key }}

    - name: Build third-party from source (cache miss)
      if: steps.tp-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.source-dir }}
      env:
        ELOQ_THIRD_PARTY_PREFIX: ${{ inputs.prefix }}
      run: |
        set -euo pipefail
        git config --global --add safe.directory '*'
        bash src/mongo/db/modules/eloq/data_substrate/scripts/third_party/install-ubuntu2404.sh
        test -f "${{ inputs.prefix }}/share/eloq/third_party-manifest.yml"
        test -d "${{ inputs.prefix }}/lib"
