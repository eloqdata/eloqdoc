name: test-clang-format

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: DoozyX/clang-format-lint-action@v0.18
      with:
        source: './src/mongo/db/modules/eloq'
        extensions: 'h,cpp'
        clangFormatVersion: 18
        style: file
