name: Build Validation

# Compile-only validation from a bare Ubuntu 24.04 image. This follows the
# documented user build path: install EloqDoc system/Python dependencies with
# scripts/install_dependency_ubuntu2404.sh, restore or build the shared
# Data Substrate third-party prefix from cache, then compile each shipped engine
# combination. Functional tests stay in ci.yml.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-all-variants:
    name: compile-all-variants (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    container:
      image: ubuntu:24.04
      options: --user root --privileged --security-opt seccomp=unconfined --ulimit memlock=-1:-1
    env:
      ELOQ_THIRD_PARTY_PREFIX: /opt/eloq/third_party
      PYENV_ROOT: /opt/pyenv
      SCONS_CACHE_DIR: ${{ github.workspace }}/scons-cache
      SCONS_CACHE_SIZE_GB: 2
    steps:
      - name: Bootstrap checkout tools
        shell: bash
        run: |
          set -euo pipefail
          apt_with_retry() {
            local attempt=1
            local max_attempts=5
            local delay=15

            until apt-get \
              -o APT::Update::Error-Mode=any \
              -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              "$@"; do
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                return 1
              fi
              echo "apt-get $* failed; retrying in ${delay}s (${attempt}/${max_attempts})"
              sleep "${delay}"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          apt_with_retry update
          apt_with_retry install -y --no-install-recommends git ca-certificates sudo openssh-client tar zstd

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout product submodules
        run: |
          git config --global --add safe.directory '*'
          bash scripts/checkout_product_submodules.sh

      - name: Restore Python 2.7 cache
        uses: actions/cache@v4
        with:
          path: /opt/pyenv
          key: pyenv-2.7.18-${{ matrix.arch }}-${{ hashFiles('scripts/install_dependency_ubuntu2404.sh', 'scripts/buildscripts/requirements.txt', 'scripts/buildscripts/resmokelib/requirements.txt') }}
          restore-keys: |
            pyenv-2.7.18-${{ matrix.arch }}-

      - name: Install system and Python dependencies
        run: |
          git config --global --add safe.directory '*'
          ELOQ_SKIP_THIRD_PARTY=1 \
            bash scripts/install_dependency_ubuntu2404.sh "${GITHUB_WORKSPACE}/build-validation-deps"

      - name: Setup third-party (cached)
        uses: ./.github/actions/setup-third-party
        with:
          source-dir: ${{ github.workspace }}
          arch: ${{ matrix.arch }}
          cache-scope: bare-ubuntu

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/scons-cache
          key: eloqdoc-scons-${{ matrix.arch }}-RelWithDebInfo-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            eloqdoc-scons-${{ matrix.arch }}-RelWithDebInfo-

      - name: Compile all variants
        run: |
          git config --global --add safe.directory '*'
          bash .github/scripts/compile_all_variants.sh
