name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prime-third-party:
    name: prime-third-party (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container:
      image: eloqdata/ubuntu-dev:24.04
      options: --user root
    env:
      ELOQ_THIRD_PARTY_PREFIX: /opt/eloq/third_party
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          path: eloqdoc
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout product submodules
        run: |
          git config --global --add safe.directory '*'
          cd "$GITHUB_WORKSPACE/eloqdoc"
          bash scripts/checkout_product_submodules.sh

      - name: Setup third-party (cached)
        uses: ./eloqdoc/.github/actions/setup-third-party
        with:
          source-dir: ${{ github.workspace }}/eloqdoc
          arch: ${{ matrix.arch }}
          cache-scope: ubuntu-dev

  ent-ci:
    needs: prime-third-party
    concurrency:
      group: ent-ci-${{ github.event.pull_request.number || github.ref }}-${{ matrix.build_type }}-${{ matrix.engine.id }}-${{ matrix.arch }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, RelWithDebInfo]
        arch: [amd64, arm64]
        engine:
          - id: rocksdb
            data_store_type: ELOQDSS_ROCKSDB
            log_state: ROCKSDB
          - id: rocks_s3
            data_store_type: ELOQDSS_ROCKSDB_CLOUD_S3
            log_state: ROCKSDB_CLOUD_S3
          - id: eloqstore_s3
            data_store_type: ELOQDSS_ELOQSTORE
            log_state: ROCKSDB_CLOUD_S3
        exclude:
          # Debug rocks_s3 amd64 currently hangs beyond the jstest timeout on
          # hosted runners. Runtime coverage remains in Debug arm64 and both
          # RelWithDebInfo arches; build coverage remains in Build Validation.
          - build_type: Debug
            arch: amd64
            engine:
              id: rocks_s3
              data_store_type: ELOQDSS_ROCKSDB_CLOUD_S3
              log_state: ROCKSDB_CLOUD_S3

          # Debug eloqstore_s3 arm64 currently exhausts the hosted runner disk while
          # running jstests; arm64 build coverage remains in Build Validation and
          # runtime coverage remains in RelWithDebInfo.
          - build_type: Debug
            arch: arm64
            engine:
              id: eloqstore_s3
              data_store_type: ELOQDSS_ELOQSTORE
              log_state: ROCKSDB_CLOUD_S3

    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container:
      image: eloqdata/ubuntu-dev:24.04
      options: --user root --privileged --security-opt seccomp=unconfined --ulimit memlock=-1:-1

    name: ${{ github.event_name == 'push' && 'main' || 'PR' }} ${{ matrix.build_type }}-${{ matrix.engine.id }}-${{ matrix.arch }}

    env:
      ELOQ_THIRD_PARTY_PREFIX: /opt/eloq/third_party
      CMAKE_PREFIX_PATH: /opt/eloq/third_party
      CMAKE_INCLUDE_PATH: /opt/eloq/third_party/include
      CMAKE_LIBRARY_PATH: /opt/eloq/third_party/lib
      LD_LIBRARY_PATH: /opt/eloq/third_party/lib:/opt/eloq/third_party/lib64

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          path: eloqdoc
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout product submodules
        run: |
          git config --global --add safe.directory '*'
          cd "$GITHUB_WORKSPACE/eloqdoc"
          bash scripts/checkout_product_submodules.sh

      - name: Clone py-tpcc
        run: |
          git config --global --add safe.directory '*'
          git clone --recurse-submodules https://github.com/eloqdata/py-tpcc.git py_tpcc_src
          cd py_tpcc_src
          git checkout production || true

      - name: Setup third-party (cached)
        uses: ./eloqdoc/.github/actions/setup-third-party
        with:
          source-dir: ${{ github.workspace }}/eloqdoc
          arch: ${{ matrix.arch }}
          cache-scope: ubuntu-dev

      - name: Run CI (${{ matrix.build_type }}, ${{ matrix.engine.id }})
        env:
          MINIO_ENDPOINT: http://127.0.0.1:9900
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          BUILD_TYPE: ${{ matrix.build_type }}
          ENGINE_ID: ${{ matrix.engine.id }}
          ARCH: ${{ matrix.arch }}
          CI_MODE: ${{ github.event_name == 'push' && 'main' || 'pr' }}
          NODE_MEMORY_LIMIT_MB: 2048
        run: |
          NPROC=$(nproc)
          if [ "$BUILD_TYPE" = "Debug" ]; then
            export BUILD_JOBS=$NPROC
          else
            export BUILD_JOBS=$(( (NPROC + 1) / 2 ))
          fi
          if [ "$BUILD_TYPE" = "Debug" ] || [ "$ENGINE_ID" = "eloqstore_s3" ] || { [ "$ENGINE_ID" = "rocks_s3" ] && [ "$ARCH" = "arm64" ]; }; then
            export JSTEST_TIMEOUT_SECONDS=7200
          fi
          bash ./eloqdoc/.github/scripts/gh_ci_entry.sh \
            "$MINIO_ENDPOINT" \
            "$MINIO_ACCESS_KEY" \
            "$MINIO_SECRET_KEY" \
            "${{ matrix.engine.data_store_type }}" \
            "${{ matrix.engine.log_state }}"
